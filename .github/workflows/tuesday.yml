name: Tuesday Review Prep

on:
  repository_dispatch:
    types: [tuesday-review]
  workflow_dispatch:

permissions:
  contents: write           # prep.json / log 커밋·푸시 권한

jobs:
  run-prep:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.13
        uses: actions/setup-python@v5.5.0
        with:
          python-version: "3.13"

      - name: Run tuesday prep (루틴 B 집계, 판단 없음)
        run: python tuesday_prep.py

      - name: Run weekly prep (루틴 A 노션 조회, 판단 없음)
        continue-on-error: true   # A 조회 실패가 B 커밋을 막지 않도록 격리
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python weekly_prep.py

      - name: Commit and push prep
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/   # A/B prep + log 모두 스테이징 (날짜 JSON은 무변경이라 no-op)
          git diff --cached --quiet && echo "변경 없음, 스킵" || (
            git commit -m "data: $(date +'%Y-%m-%d') 화요일 루틴 A/B prep"
            git push
          )
